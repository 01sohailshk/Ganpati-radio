<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>गणपति उत्सव | Ganpati Radio</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --liquid-bg: rgba(255, 255, 255, 0.07);
      --liquid-border: rgba(255, 255, 255, 0.18);
      --liquid-glow: rgba(255, 184, 0, 0.4);
      --accent-gold: #ffd166;
      --accent-orange: #ff5e00;
      --card-blur: blur(25px) saturate(200%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050201;
      color: #ffffff;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #050201 url('https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
      transform: scale(1.05);
      animation: hdBackgroundBreathing 20s ease-in-out infinite alternate;
    }

    @keyframes hdBackgroundBreathing {
      0% { transform: scale(1.02) rotate(0deg); filter: brightness(0.85) contrast(1.15); }
      50% { transform: scale(1.07) rotate(0.5deg); filter: brightness(1) contrast(1.2); }
      100% { transform: scale(1.02) rotate(0deg); filter: brightness(0.85) contrast(1.15); }
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(13, 2, 0, 0.25) 0%, rgba(5, 2, 1, 0.88) 85%, #050201 100%),
                  linear-gradient(to bottom, rgba(5,2,1,0.6) 0%, transparent 40%, rgba(5,2,1,0.95) 100%);
    }

    .ambient-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 120, 0, 0.35) 0%, rgba(255, 209, 102, 0.15) 50%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      animation: glowPulse 6s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    }

    #visualizerCanvas, #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #visualizerCanvas { z-index: 2; opacity: 0.85; }
    #particleCanvas { z-index: 3; }

    .liquid-glass {
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--liquid-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 30px;
    }

    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      white-space: nowrap;
      color: rgba(255,255,255,0.9);
    }

    .online-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      white-space: nowrap;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 12px #00ff88;
      animation: livePulse 1.8s infinite;
      flex-shrink: 0;
    }

    @keyframes livePulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--liquid-border);
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 25px rgba(255, 209, 102, 0.2);
    }

    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.red { background: rgba(255, 30, 0, 0.35); border-color: rgba(255, 100, 100, 0.4); }

    .pill-btn {
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      border: 1px solid var(--liquid-border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .pill-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 209, 102, 0.5);
    }

    .pill-btn:active { transform: scale(0.94); }

    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-grow: 1;
    }

    .devanagari-title {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 10%, #ffe399 50%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 25px rgba(0,0,0,0.9));
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      margin-top: 8px;
      font-size: clamp(10px, 2.8vw, 13px);
      letter-spacing: 6px;
      color: rgba(255,255,255,0.9);
      font-weight: 800;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .devotional-toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dev-btn {
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: rgba(20, 8, 3, 0.65);
      white-space: nowrap;
      border-radius: 30px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .dev-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 25px rgba(255, 209, 102, 0.25);
      border-color: var(--accent-gold);
    }

    .player-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 0 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-card {
      width: 100%;
      max-width: 580px;
      background: rgba(15, 6, 3, 0.72);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .album-art {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      border: 2px solid rgba(255,209,102,0.6);
      animation: rotateArt 20s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }

    .album-art.playing { animation-play-state: running; }

    @keyframes rotateArt { 100% { transform: rotate(360deg); } }

    .song-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .song-title {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .artist-name {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .player-controls-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.2s;
    }

    .control-btn:hover { color: var(--accent-gold); transform: scale(1.1); }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      color: #1a0a00;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 209, 102, 0.45);
      flex-shrink: 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 209, 102, 0.6);
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    #progressBar {
      width: 80px;
      height: 4px;
      accent-color: var(--accent-gold);
      cursor: pointer;
      border-radius: 4px;
    }

    .time-stamps {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: rgba(20, 8, 4, 0.95);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 -15px 50px rgba(0,0,0,0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-gold);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 0 8px;
    }

    .modal-body-container {
      overflow-y: auto;
      margin-top: 12px;
    }

    .playlist-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .playlist-card:hover {
      background: rgba(255, 209, 102, 0.12);
      transform: translateY(-2px);
    }

    .playlist-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 209, 102, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      font-size: 20px;
    }

    .playlist-info h4 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .playlist-info p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover { background: rgba(255, 255, 255, 0.1); }

    .song-item.active {
      background: rgba(255, 209, 102, 0.18);
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    .song-item-info {
      display: flex;
      flex-direction: column;
    }

    .song-item-title {
      font-size: 13px;
      font-weight: 700;
    }

    .song-item-artist {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      .top-bar { padding: 12px 14px; }
      .time-display { display: none; }
      .pill-btn, .dev-btn { padding: 7px 12px; font-size: 11px; }
      #progressBar { width: 55px; }
      .ambient-glow { width: 300px; height: 300px; }
    }

    @media (min-width: 768px) {
      .modal { align-items: center; }
      .modal-content { border-radius: 28px; }
      #progressBar { width: 100px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <canvas id="visualizerCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>

    <div class="background-container">
      <div class="bg-overlay"></div>
    </div>
    
    <div class="ambient-glow"></div>

    <header class="top-bar">
      <div class="header-left">
        <div class="time-display" id="timeDisplay">--:-- --</div>
        <div class="online-indicator liquid-glass">
          <span class="green-dot"></span>
          <span class="online-count" id="onlineCount">1 online</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="https://open.spotify.com" target="_blank" rel="noopener" class="icon-btn" id="spotifyBtn" title="Spotify"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://music.youtube.com" target="_blank" rel="noopener" class="icon-btn red" id="ytBtn" title="YouTube Music"><i class="fa-brands fa-youtube"></i></a>
        <button class="pill-btn liquid-glass" id="playlistsBtn">Playlists (2)</button>
        <button class="pill-btn liquid-glass" id="songsBtn">All Tracks (25)</button>
      </div>
    </header>

    <main class="center-content">
      <div class="title-group">
        <h1 class="devanagari-title">गणपति उत्सव</h1>
        <p class="subtitle">GANPATI RADIO • OPEN ALL HOURS</p>
      </div>

      <div class="devotional-toolbar">
        <button class="dev-btn liquid-glass" id="flowerBtn"><i class="fa-solid fa-spa"></i> Pushpa Varsha</button>
      </div>
    </main>

    <footer class="player-wrapper">
      <div class="player-card">
        <div class="song-info">
          <img id="albumArt" src="https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=400&auto=format&fit=crop" alt="Album Art" class="album-art">
          <div class="song-details">
            <h3 id="songTitle" class="song-title">Loading...</h3>
            <p id="artistName" class="artist-name">Ganpati Radio</p>
          </div>
        </div>

        <div class="player-controls-container">
          <div class="playback-buttons">
            <button id="prevBtn" class="control-btn" aria-label="Previous Track"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playPauseBtn" class="play-btn" aria-label="Play/Pause"><i id="playIcon" class="fa-solid fa-play"></i></button>
            <button id="nextBtn" class="control-btn" aria-label="Next Track"><i class="fa-solid fa-forward-step"></i></button>
          </div>
          <div class="progress-container">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="time-stamps">
              <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div class="modal" id="songsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
          <h2 class="modal-title" id="modalTitle">Playlists</h2>
        </div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body-container" id="modalBodyContainer"></div>
    </div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous" playsinline></audio>

  <script>
    // 25 Ganpati tracks (19 Songs + 6 Aartis)
    const songPlaylist = [
      { id: 1, title: "1. Deva Shree Ganesha", artist: "Ajay Gogavale", src: "songs/dev-shree-ganesha.mp3" },
      { id: 2, title: "2. Maurya Re", artist: "Shankar Mahadevan", src: "songs/maurya-re.mp3" },
      { id: 3, title: "3. Sadda Dil Vi Tu (Ga Ga Ga Ganpati)", artist: "Hard Kaur", src: "songs/sadda-dil-vi-tu.mp3" },
      { id: 4, title: "4. Aala Re Aala Ganesha", artist: "Wajid", src: "songs/aala-re-aala-ganesha.mp3" },
      { id: 5, title: "5. Bappa", artist: "Vishal Dadlani", src: "songs/bappa.mp3" },
      { id: 6, title: "6. Gajanana", artist: "Sukhwinder Singh", src: "songs/gajanana.mp3" },
      { id: 7, title: "7. Suno Ganpati Bappa Morya", artist: "Amit Mishra", src: "songs/suno-ganpati-bappa-morya.mp3" },
      { id: 8, title: "8. Hey Ganaraya", artist: "Divya Kumar", src: "songs/hey-ganaraya.mp3" },
      { id: 9, title: "9. Ganpati Bappa Morya", artist: "Sajid-Wajid", src: "songs/ganpati-bappa-morya.mp3" },
      { id: 10, title: "10. Sindoor Lal Chhadayo", artist: "Kavita Krishnamurthy", src: "songs/sindoor-lal-chhadayo.mp3" },
      { id: 11, title: "11. Shree Ganeshay Dheemahi", artist: "Shankar Mahadevan", src: "songs/shree-ganeshay-dheemahi.mp3" },
      { id: 12, title: "12. Jalwa", artist: "Wajid", src: "songs/jalwa.mp3" },
      { id: 13, title: "13. Vakratunda Mahakaya", artist: "Shankar Mahadevan", src: "songs/vakratunda-mahakaya.mp3" },
      { id: 14, title: "14. Oh My God Ganesha", artist: "Sukhwinder Singh", src: "songs/oh-my-god-ganesha.mp3" },
      { id: 15, title: "15. Tera Hi Jalwa", artist: "Sajid-Wajid", src: "songs/tera-hi-jalwa.mp3" },
      { id: 16, title: "16. Bappa Morya", artist: "Mika Singh", src: "songs/bappa-morya.mp3" },
      { id: 17, title: "17. Ganesha (Title Track)", artist: "Adnan Sami", src: "songs/ganesha-title-track.mp3" },
      { id: 18, title: "18. Aala Re Aala Aala Bappa", artist: "Swapnil Bandodkar", src: "songs/aala-re-aala-bappa.mp3" },
      { id: 19, title: "19. Ya Re Ya Sare Lahan Mothe", artist: "Avadhoot Gupte", src: "songs/ya-re-ya-sare.mp3" }
    ];

    const aartiList = [
      { id: 101, title: "20. Sukhkarta Dukhharta Aarti", artist: "Sadhana Sargam", src: "songs/sukhkarta-dukhharta-aarti.mp3" },
      { id: 102, title: "21. Shevanti Che Phool", artist: "Lata Mangeshkar", src: "songs/shevanti-che-phool.mp3" },
      { id: 103, title: "22. Lavthavti Vikrala Aarti", artist: "Anuradha Paudwal", src: "songs/lavthavti-vikrala.mp3" },
      { id: 104, title: "23. Durge Durgat Bhari Aarti", artist: "Usha Mangeshkar", src: "songs/durge-durgat-bhari.mp3" },
      { id: 105, title: "24. Jai Ganesh Jai Ganesh Deva", artist: "Anuradha Paudwal", src: "songs/jai-ganesh-deva.mp3" },
      { id: 106, title: "25. Ghalin Lotangan Vandin Chharan", artist: "Sanjeev Abhyankar", src: "songs/ghalin-lotangan.mp3" }
    ];

    const fullPlaylist = [...songPlaylist, ...aartiList];
    let currentTrackIndex = 0;

    const audio = document.getElementById("audioPlayer");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const songTitle = document.getElementById("songTitle");
    const artistName = document.getElementById("artistName");
    const albumArt = document.getElementById("albumArt");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const onlineCountEl = document.getElementById("onlineCount");

    const songsModal = document.getElementById("songsModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const backBtn = document.getElementById("backBtn");
    const modalTitle = document.getElementById("modalTitle");
    const songsBtn = document.getElementById("songsBtn");
    const playlistsBtn = document.getElementById("playlistsBtn");
    const modalBodyContainer = document.getElementById("modalBodyContainer");

    const firebaseConfig = { databaseURL: "https://ganpati-live-default-rtdb.firebaseio.com" };
    try {
      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const connectedRef = db.ref(".info/connected");
        const presenceRef = db.ref("live_presence");

        connectedRef.on("value", (snap) => {
          if (snap.val() === true) {
            const con = presenceRef.push();
            con.onDisconnect().remove();
            con.set(true);
          }
        });

        presenceRef.on("value", (snap) => {
          const count = snap.numChildren();
          onlineCountEl.textContent = `${Math.max(1, count)} online`;
        });
      }
    } catch(e) {
      onlineCountEl.textContent = "1 online";
    }

    let audioCtx, analyser, dataArray, source;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        
        audioCtx = new AudioCtx();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        
        try {
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
        } catch (e) {
          console.warn("Audio Context creation failed:", e);
        }
      }
    }

    document.addEventListener('touchstart', function unlockAudio() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });

    function loadTrack(index) {
      const track = fullPlaylist[index];
      songTitle.textContent = track.title;
      artistName.textContent = track.artist;
      audio.src = track.src;

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "Ganpati Utsav Radio",
          artwork: [{ src: albumArt.src, sizes: '512x512', type: 'image/jpeg' }]
        });
      }
    }

    function togglePlay() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (audio.paused) {
        audio.play().then(() => {
          playIcon.className = "fa-solid fa-pause";
          albumArt.classList.add("playing");
        }).catch((e) => {
          console.error("Playback error:", e);
          playIcon.className = "fa-solid fa-play";
          albumArt.classList.remove("playing");
        });
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        albumArt.classList.remove("playing");
      }
    }

    nextBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    prevBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex - 1 + fullPlaylist.length) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    playPauseBtn.addEventListener("click", togglePlay);

    audio.addEventListener("ended", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
      navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    }

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    const visCanvas = document.getElementById("visualizerCanvas");
    const visCtx = visCanvas.getContext("2d");
    const particleCanvas = document.getElementById("particleCanvas");
    const pCtx = particleCanvas.getContext("2d");

    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      visCanvas.width = window.innerWidth * dpr;
      visCanvas.height = window.innerHeight * dpr;
      particleCanvas.width = window.innerWidth * dpr;
      particleCanvas.height = window.innerHeight * dpr;

      visCtx.scale(dpr, dpr);
      pCtx.scale(dpr, dpr);
    }
    window.addEventListener("resize", resizeCanvases);

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      visCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (!analyser || audio.paused || !dataArray) return;

      analyser.getByteFrequencyData(dataArray);
      const bufferLength = analyser.frequencyBinCount;
      const barWidth = (window.innerWidth / bufferLength) * 2.2;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * (window.innerHeight * 0.22);

        const gradient = visCtx.createLinearGradient(0, window.innerHeight, 0, window.innerHeight - barHeight);
        gradient.addColorStop(0, "rgba(255, 209, 102, 0.1)");
        gradient.addColorStop(1, "rgba(255, 150, 0, 0.85)");

        visCtx.fillStyle = gradient;
        visCtx.fillRect(x, window.innerHeight - barHeight, barWidth - 2, barHeight);

        x += barWidth;
      }
    }

    let particles = [];
    const petalColors = [
      { fill: '#e60033', shade: '#990022' },
      { fill: '#ff6600', shade: '#b34700' },
      { fill: '#ffcc00', shade: '#b38f00' },
      { fill: '#ff3385', shade: '#b30054' }
    ];

    class RealisticPetal {
      constructor() { this.reset(); }

      reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = -30 - Math.random() * 50;
        this.size = Math.random() * 8 + 10;
        this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
        this.speedY = Math.random() * 1.5 + 1.2;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.oscillationSpeed = Math.random() * 0.03 + 0.01;
        this.oscillationAmp = Math.random() * 2 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.rotX = Math.random() * Math.PI;
        this.rotY = Math.random() * Math.PI;
        this.rotZ = Math.random() * Math.PI;
        this.rotSpeedX = (Math.random() - 0.5) * 0.04;
        this.rotSpeedY = (Math.random() - 0.5) * 0.05;
        this.rotSpeedZ = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.3 + 0.7;
      }

      update() {
        this.angle += this.oscillationSpeed;
        this.x += Math.sin(this.angle) * this.oscillationAmp + this.speedX;
        this.y += this.speedY;

        this.rotX += this.rotSpeedX;
        this.rotY += this.rotSpeedY;
        this.rotZ += this.rotSpeedZ;
      }

      draw() {
        pCtx.save();
        pCtx.translate(this.x, this.y);

        const scaleX = Math.cos(this.rotY);
        const scaleY = Math.sin(this.rotX);

        pCtx.rotate(this.rotZ);
        pCtx.scale(scaleX, scaleY);
        pCtx.globalAlpha = this.opacity;

        const grad = pCtx.createRadialGradient(0, 0, 2, 0, 0, this.size);
        grad.addColorStop(0, this.color.fill);
        grad.addColorStop(0.8, this.color.fill);
        grad.addColorStop(1, this.color.shade);

        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.moveTo(0, -this.size);
        pCtx.bezierCurveTo(this.size * 0.8, -this.size * 0.5, this.size * 0.8, this.size * 0.6, 0, this.size);
        pCtx.bezierCurveTo(-this.size * 0.8, this.size * 0.6, -this.size * 0.8, -this.size * 0.5, 0, -this.size);
        pCtx.fill();

        pCtx.strokeStyle = 'rgba(255,255,255,0.2)';
        pCtx.lineWidth = 0.8;
        pCtx.beginPath();
        pCtx.moveTo(0, -this.size * 0.8);
        pCtx.lineTo(0, this.size * 0.8);
        pCtx.stroke();

        pCtx.restore();
      }
    }

    function triggerFlowerShower() {
      for (let i = 0; i < 75; i++) {
        particles.push(new RealisticPetal());
      }
    }

    function animateParticles() {
      requestAnimationFrame(animateParticles);
      pCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.y > window.innerHeight + 40) {
          particles.splice(i, 1);
        }
      }
    }

    document.getElementById("flowerBtn").addEventListener("click", triggerFlowerShower);

    playlistsBtn.addEventListener("click", () => { openModal(); renderPlaylistsView(); });
    songsBtn.addEventListener("click", () => { openModal(); renderAllTracksView(); });
    closeModalBtn.addEventListener("click", closeModal);
    backBtn.addEventListener("click", renderPlaylistsView);
    songsModal.addEventListener("click", (e) => { if (e.target === songsModal) closeModal(); });

    function openModal() { songsModal.style.display = "flex"; }
    function closeModal() { songsModal.style.display = "none"; }

    function renderPlaylistsView() {
      modalTitle.textContent = "Playlists (2)";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = `
        <div class="playlist-card" id="playlistSongs">
          <div class="playlist-icon"><i class="fa-solid fa-music"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Songs</h4>
            <p>${songPlaylist.length} Songs • Devotional Collection</p>
          </div>
        </div>

        <div class="playlist-card" id="playlistAartis">
          <div class="playlist-icon"><i class="fa-solid fa-om"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Aartis</h4>
            <p>${aartiList.length} Aartis • Sacred Chants</p>
          </div>
        </div>
      `;

      document.getElementById("playlistSongs").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Songs", songPlaylist, 0);
      });

      document.getElementById("playlistAartis").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Aartis", aartiList, songPlaylist.length);
      });
    }

    function renderPlaylistTracks(title, trackList, globalOffset) {
      modalTitle.textContent = title;
      backBtn.style.display = "inline-block";
      modalBodyContainer.innerHTML = "";

      trackList.forEach((song, idx) => {
        const globalIdx = globalOffset + idx;
        modalBodyContainer.appendChild(createSongRow(song, globalIdx));
      });
    }

    function renderAllTracksView() {
      modalTitle.textContent = "All Tracks";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = "";

      fullPlaylist.forEach((song, globalIdx) => {
        modalBodyContainer.appendChild(createSongRow(song, globalIdx));
      });
    }

    function createSongRow(song, globalIndex) {
      const item = document.createElement("div");
      item.className = `song-item ${globalIndex === currentTrackIndex ? 'active' : ''}`;
      item.innerHTML = `
        <div class="song-item-info">
          <span class="song-item-title">${song.title}</span>
          <span class="song-item-artist">${song.artist}</span>
        </div>
      `;
      item.addEventListener("click", () => {
        currentTrackIndex = globalIndex;
        loadTrack(currentTrackIndex);
        togglePlay();
        closeModal();
      });
      return item;
    }

    function updateTime() {
      const timeDisplay = document.getElementById("timeDisplay");
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    setInterval(updateTime, 1000);
    resizeCanvases();
    loadTrack(currentTrackIndex);
    drawVisualizer();
    animateParticles();
    updateTime();
  </script>
</body>
</html>
