<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>गणपति उत्सव | Ganpati Radio</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-image: url('https://images.unsplash.com/photo-1567157577867-05ccb1388e66?q=80&w=1200&auto=format&fit=crop');
      --liquid-bg: rgba(255, 255, 255, 0.12);
      --liquid-border: rgba(255, 255, 255, 0.25);
      --accent-gold: #ffd166;
      --player-bg: rgba(20, 8, 5, 0.92);
      --card-blur: blur(24px) saturate(180%);
    }

    body.theme-art {
      --bg-image: url('https://images.unsplash.com/photo-1567157577867-05ccb1388e66?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ffd166;
    }

    body.theme-gold {
      --bg-image: url('https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ffb703;
    }

    body.theme-neon {
      --bg-image: url('https://images.unsplash.com/photo-1609102026400-0e922f30b991?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ff007f;
    }

    body.theme-dark {
      --bg-image: url('https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #00f0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0200;
      color: #ffffff;
    }

    /* Mobile Viewport Optimization */
    .app-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    /* Canvases */
    #visualizerCanvas, #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #visualizerCanvas { z-index: 2; opacity: 0.85; }
    #particleCanvas { z-index: 3; }

    /* Mobile Wallpaper Layer */
    .background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background-color: #1a0500;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out;
      animation: festivalPulse 14s ease infinite alternate;
    }

    @keyframes festivalPulse {
      0% { transform: scale(1); filter: brightness(0.9) contrast(1.05); }
      50% { transform: scale(1.04); filter: brightness(1) contrast(1.1); }
      100% { transform: scale(1); filter: brightness(0.9) contrast(1.05); }
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15) 10%, rgba(13, 2, 0, 0.9) 100%);
    }

    /* Glass UI Controls */
    .liquid-pill {
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--liquid-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      border-radius: 30px;
    }

    /* Mobile Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 12px;
      width: 100%;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .time-display {
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .online-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
    }

    .green-dot {
      width: 7px;
      height: 7px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      animation: livePulse 1.8s infinite;
    }

    @keyframes livePulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .action-buttons::-webkit-scrollbar { display: none; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--liquid-border);
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      color: white;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .icon-btn.red {
      background: rgba(255, 0, 0, 0.4);
      border-color: rgba(255, 100, 100, 0.4);
    }

    .pill-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      border: 1px solid var(--liquid-border);
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Central Content Area */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-grow: 1;
    }

    .devanagari-title {
      font-size: clamp(2.5rem, 11vw, 4rem);
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .devotional-toolbar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }

    .dev-btn {
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 10, 5, 0.75);
      border-radius: 30px;
      touch-action: manipulation;
      border: 1px solid var(--liquid-border);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .dev-btn:active {
      transform: scale(0.95);
    }

    /* Mobile Audio Player UI */
    .player-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 0 12px;
    }

    .player-card {
      width: 100%;
      background: var(--player-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--liquid-border);
      border-radius: 24px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .album-art {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.3);
      animation: rotateArt 18s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }

    .album-art.playing { animation-play-state: running; }

    @keyframes rotateArt { 100% { transform: rotate(360deg); } }

    .song-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .song-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      color: #1a0a00;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    #progressBar {
      width: 100%;
      height: 4px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      width: 100%;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Mobile Bottom-Sheet Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: rgba(20, 8, 5, 0.96);
      border: 1px solid var(--liquid-border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      padding: 18px 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-gold);
      font-size: 16px;
      display: none;
      cursor: pointer;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-body-container {
      overflow-y: auto;
      margin-top: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .theme-card {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      height: 95px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 6px;
      cursor: pointer;
    }

    .theme-card.active { border-color: var(--accent-gold); }

    .theme-card span {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 5px;
      border-radius: 6px;
      width: 100%;
      text-align: center;
    }

    .playlist-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .playlist-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 209, 102, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
    }

    .playlist-info h4 { font-size: 14px; }
    .playlist-info p { font-size: 11px; color: rgba(255, 255, 255, 0.6); }

    .song-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .song-item.active {
      background: rgba(255, 209, 102, 0.18);
      border: 1px solid rgba(255, 209, 102, 0.3);
    }

    .song-item-title { font-size: 13px; font-weight: 600; display: block; }
    .song-item-artist { font-size: 11px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body class="theme-art">

  <audio id="audioPlayer"></audio>

  <div class="app-container">
    <canvas id="visualizerCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>

    <div class="background-container">
      <div class="overlay"></div>
    </div>

    <!-- Top Header -->
    <header class="top-bar">
      <div class="header-top">
        <div class="time-display" id="timeDisplay">--:-- --</div>
        <div class="online-indicator liquid-pill">
          <span class="green-dot"></span>
          <span class="online-count" id="onlineCount">1 online</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="pill-btn liquid-pill" id="themeBtn"><i class="fa-solid fa-palette"></i> Themes</button>
        <a href="https://open.spotify.com" target="_blank" rel="noopener" class="icon-btn" id="spotifyBtn"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://music.youtube.com" target="_blank" rel="noopener" class="icon-btn red" id="ytBtn"><i class="fa-brands fa-youtube"></i></a>
        <button class="pill-btn liquid-pill" id="playlistsBtn">Playlists</button>
        <button class="pill-btn liquid-pill" id="songsBtn">All Tracks</button>
      </div>
    </header>

    <!-- Center Hero Section -->
    <main class="center-content">
      <div class="title-group">
        <h1 class="devanagari-title">गणपति उत्सव</h1>
        <p class="subtitle">GANPATI RADIO • OPEN ALL HOURS</p>
      </div>

      <div class="devotional-toolbar">
        <button class="dev-btn liquid-pill" id="flowerBtn"><i class="fa-solid fa-spa"></i> Pushpa Varsha</button>
      </div>
    </main>

    <!-- Bottom Mobile Player Card -->
    <footer class="player-wrapper">
      <div class="player-card">
        <div class="song-info">
          <img id="albumArt" src="https://images.unsplash.com/photo-1567157577867-05ccb1388e66?q=80&w=400&auto=format&fit=crop" alt="Album Art" class="album-art">
          <div class="song-details">
            <h3 id="songTitle" class="song-title">Loading...</h3>
            <p id="artistName" class="artist-name">Ganpati Radio</p>
          </div>
          <div class="volume-container">
            <i class="fa-solid fa-volume-high" style="font-size: 13px; color: var(--accent-gold);"></i>
            <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1" style="width: 45px; accent-color: var(--accent-gold); cursor: pointer;">
          </div>
        </div>

        <div class="player-controls-row">
          <div class="playback-buttons">
            <button id="prevBtn" class="control-btn" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playPauseBtn" class="play-btn" aria-label="Play/Pause"><i id="playIcon" class="fa-solid fa-play"></i></button>
            <button id="nextBtn" class="control-btn" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <div class="progress-container">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="time-stamps">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Mobile Bottom Sheet Modal -->
  <div class="modal" id="songsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
          <h3 class="modal-title" id="modalTitle">Select View</h3>
        </div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body-container" id="modalBodyContainer"></div>
    </div>
  </div>

  <script>
    const themes = [

      { id: 17, title: "17. Ganesha Naman", artist: "Lata Mangeshkar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 18, title: "18. Vigneswaraya Kumara", artist: "Hariharan", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 19, title: "19. Ganpati Bappa Morya Title", artist: "Vishal-Shekhar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 20, title: "20. O My Friend Ganesha", artist: "Shravan Suresh", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 21, title: "21. Ekadantaya Vakratundaya", artist: "Shankar Mahadevan", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 22, title: "22. Maha Ganesha", artist: "K. S. Chithra", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 23, title: "23. Pratham Tula Vandito", artist: "Vasantrao Deshpande", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" }
    ];

    const aartiList = [
      { id: 24, title: "24. Sukhkarta Dukhharta Aarti", artist: "Sadhana Sargam", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 25, title: "25. Shendur Lal Chadhayo Aarti", artist: "Ravindra Sathe", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 26, title: "26. Jai Ganesh Jai Ganesh Deva", artist: "Anuradha Paudwal", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 27, title: "27. Ghalin Lotangan", artist: "Lata Mangeshkar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 28, title: "28. Lavthavti Vikrala Aarti", artist: "Sanjeev Abhyankar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 29, title: "29. Nana Parimala Samarpana", artist: "Suresh Wadkar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" },
      { id: 30, title: "30. Ganpati Atharvashirsha", artist: "Sanjeev Abhyankar", src: "https://archive.org/download/SukhakartaDukhaharta/01-Sukhakarta%20Dukhaharta%20%28Aarti%29.mp3" }
    ];

    const fullPlaylist = [...songPlaylist, ...aartiList];
    let currentTrackIndex = 0;

    const audio = document.getElementById("audioPlayer");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const songTitle = document.getElementById("songTitle");
    const artistName = document.getElementById("artistName");
    const albumArt = document.getElementById("albumArt");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeBar = document.getElementById("volumeBar");

    const songsModal = document.getElementById("songsModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const backBtn = document.getElementById("backBtn");
    const modalTitle = document.getElementById("modalTitle");
    const songsBtn = document.getElementById("songsBtn");
    const playlistsBtn = document.getElementById("playlistsBtn");
    const themeBtn = document.getElementById("themeBtn");
    const flowerBtn = document.getElementById("flowerBtn");
    const modalBodyContainer = document.getElementById("modalBodyContainer");

    function loadTrack(index) {
      const track = fullPlaylist[index];
      songTitle.textContent = track.title;
      artistName.textContent = track.artist;
      audio.src = track.src;
      audio.volume = volumeBar.value;
      audio.muted = false;
    }

    volumeBar.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('error', () => {
      if (audio.src !== fallbackAudio) {
        audio.src = fallbackAudio;
        audio.play().catch(() => {});
      }
    });

    function togglePlay() {
      if (audio.paused) {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        audio.play().then(() => {
          playIcon.className = "fa-solid fa-pause";
          albumArt.classList.add("playing");
        }).catch(() => {
          playIcon.className = "fa-solid fa-play";
          albumArt.classList.remove("playing");
        });
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        albumArt.classList.remove("playing");
      }
    }

    nextBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    prevBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex - 1 + fullPlaylist.length) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    playPauseBtn.addEventListener("click", togglePlay);

    audio.addEventListener("ended", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    themeBtn.addEventListener("click", () => { openModal(); renderThemeView(); });
    playlistsBtn.addEventListener("click", () => { openModal(); renderPlaylistsView(); });
    songsBtn.addEventListener("click", () => { openModal(); renderAllTracksView(); });
    closeModalBtn.addEventListener("click", closeModal);
    backBtn.addEventListener("click", renderPlaylistsView);

    function openModal() { songsModal.style.display = "flex"; }
    function closeModal() { songsModal.style.display = "none"; }

    function renderThemeView() {
      modalTitle.textContent = "Select Theme";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = `<div class="theme-grid"></div>`;
      const grid = modalBodyContainer.querySelector(".theme-grid");

      themes.forEach(t => {
        const card = document.createElement("div");
        card.className = `theme-card ${document.body.classList.contains(t.id) ? 'active' : ''}`;
        card.style.backgroundImage = `url('${t.img}')`;
        card.innerHTML = `<span>${t.name}</span>`;
        card.addEventListener("click", () => {
          document.body.className = t.id;
          closeModal();
        });
        grid.appendChild(card);
      });
    }

    function renderPlaylistsView() {
      modalTitle.textContent = "Playlists";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = `
        <div class="playlist-card" id="playlistSongs">
          <div class="playlist-icon"><i class="fa-solid fa-music"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Songs</h4>
            <p>${songPlaylist.length} Songs • Devotional & Festive</p>
          </div>
        </div>
        <div class="playlist-card" id="playlistAartis">
          <div class="playlist-icon"><i class="fa-solid fa-om"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Aartis</h4>
            <p>${aartiList.length} Aartis • Sacred Chants</p>
          </div>
        </div>
      `;

      document.getElementById("playlistSongs").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Songs", songPlaylist, 0);
      });
      document.getElementById("playlistAartis").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Aartis", aartiList, songPlaylist.length);
      });
    }

    function renderPlaylistTracks(title, trackList, globalOffset) {
      modalTitle.textContent = title;
      backBtn.style.display = "inline-block";
      modalBodyContainer.innerHTML = "";
      trackList.forEach((song, idx) => {
        modalBodyContainer.appendChild(createSongRow(song, globalOffset + idx));
      });
    }

    function renderAllTracksView() {
      modalTitle.textContent = "All 30 Tracks";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = "";
      fullPlaylist.forEach((song, globalIdx) => {
        modalBodyContainer.appendChild(createSongRow(song, globalIdx));
      });
    }

    function createSongRow(song, globalIndex) {
      const item = document.createElement("div");
      item.className = `song-item ${globalIndex === currentTrackIndex ? 'active' : ''}`;
      item.innerHTML = `
        <div>
          <span class="song-item-title">${song.title}</span>
          <span class="song-item-artist">${song.artist}</span>
        </div>
      `;
      item.addEventListener("click", () => {
        currentTrackIndex = globalIndex;
        loadTrack(currentTrackIndex);
        togglePlay();
        closeModal();
      });
      return item;
    }

    function updateTime() {
      const timeDisplay = document.getElementById("timeDisplay");
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateTime, 1000);

    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    const vCanvas = document.getElementById('visualizerCanvas');
    const vCtx = vCanvas.getContext('2d');

    function resizeCanvases() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
      vCanvas.width = window.innerWidth;
      vCanvas.height = window.innerHeight;
    }

    let flowers = [];

    class FlowerPetal {
      constructor() {
        this.x = Math.random() * pCanvas.width;
        this.y = -20 - Math.random() * 50;
        this.size = Math.random() * 8 + 8;
        this.speedY = Math.random() * 1.8 + 1.2;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.angle = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 2;
        this.opacity = 1.0;
        this.fadeRate = Math.random() * 0.003 + 0.002;

        const palette = ['#ff4e00', '#e01e5a', '#ffb703', '#ff0054', '#ffffff'];
        this.color = palette[Math.floor(Math.random() * palette.length)];
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX;
        this.angle += this.spin;
        this.opacity -= this.fadeRate;
      }

      draw() {
        if (this.opacity <= 0) return;

        pCtx.save();
        pCtx.translate(this.x, this.y);
        pCtx.rotate((this.angle * Math.PI) / 180);
        pCtx.globalAlpha = Math.max(0, this.opacity);
        pCtx.fillStyle = this.color;

        const numPetals = 5;
        for (let i = 0; i < numPetals; i++) {
          pCtx.rotate((Math.PI * 2) / numPetals);
          pCtx.beginPath();
          pCtx.arc(0, this.size / 2, this.size / 3, 0, Math.PI * 2);
          pCtx.fill();
        }

        pCtx.fillStyle = '#ffea00';
        pCtx.beginPath();
        pCtx.arc(0, 0, this.size / 4, 0, Math.PI * 2);
        pCtx.fill();

        pCtx.restore();
      }
    }

    function triggerFlowerShower() {
      for (let i = 0; i < 45; i++) {
        flowers.push(new FlowerPetal());
      }
    }

    flowerBtn.addEventListener("click", triggerFlowerShower);

    function animateFlowers() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      
      flowers = flowers.filter(flower => {
        flower.update();
        flower.draw();
        return flower.opacity > 0 && flower.y < pCanvas.height + 30;
      });

      requestAnimationFrame(animateFlowers);
    }

    let audioCtx, analyser, srcNode;

    function initAudioVisualizer() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        srcNode = audioCtx.createMediaElementSource(audio);
        srcNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
      } catch (e) {
        console.warn("Visualizer audio setup bypassed:", e);
      }
    }

    audio.addEventListener('play', () => {
      initAudioVisualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (vCanvas.width / bufferLength) * 2.5;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * (vCanvas.height / 3.5);
        vCtx.fillStyle = `rgba(255, 209, 102, ${dataArray[i] / 255 + 0.25})`;
        vCtx.fillRect(x, vCanvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    animateFlowers();
    drawVisualizer();
    loadTrack(currentTrackIndex);
    updateTime();
  </script>
</body>
</html>
