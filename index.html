<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>गणपति उत्सव | Ganpati Radio</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-image: url('https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=1200&auto=format&fit=crop');
      --liquid-bg: rgba(255, 255, 255, 0.12);
      --liquid-border: rgba(255, 255, 255, 0.25);
      --accent-gold: #ffd166;
      --player-bg: rgba(20, 8, 5, 0.88);
      --card-blur: blur(20px) saturate(180%);
    }

    body.theme-art {
      --bg-image: url('https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ffd166;
    }

    body.theme-gold {
      --bg-image: url('https://images.unsplash.com/photo-1567157577867-05ccb1388e66?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ffb703;
    }

    body.theme-neon {
      --bg-image: url('https://images.unsplash.com/photo-1609102026400-0e922f30b991?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #ff007f;
    }

    body.theme-dark {
      --bg-image: url('https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=1200&auto=format&fit=crop');
      --accent-gold: #00f0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0200;
      color: #ffffff;
    }

    /* Layout Structure Optimized for Mobile Viewport */
    .app-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    /* Canvases */
    #visualizerCanvas, #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #visualizerCanvas { z-index: 2; opacity: 0.85; }
    #particleCanvas { z-index: 3; }

    /* Mobile Ganpati Wallpaper */
    .background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background-color: #1a0500;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.4s ease;
      animation: festivalPulse 14s ease infinite alternate;
    }

    @keyframes festivalPulse {
      0% { transform: scale(1); filter: brightness(0.9) contrast(1.05); }
      50% { transform: scale(1.04); filter: brightness(1) contrast(1.1); }
      100% { transform: scale(1); filter: brightness(0.9) contrast(1.05); }
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15) 10%, rgba(13, 2, 0, 0.85) 100%);
    }

    /* Glass UI Elements */
    .liquid-pill {
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--liquid-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      border-radius: 30px;
    }

    /* Top Bar Mobile Optimization */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 12px;
      width: 100%;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .time-display {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .online-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
    }

    .green-dot {
      width: 7px;
      height: 7px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      animation: livePulse 1.8s infinite;
    }

    @keyframes livePulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .action-buttons {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .action-buttons::-webkit-scrollbar { display: none; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--liquid-border);
      background: var(--liquid-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .icon-btn.red {
      background: rgba(255, 0, 0, 0.4);
      border-color: rgba(255, 100, 100, 0.4);
    }

    .pill-btn {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      border: 1px solid var(--liquid-border);
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Central Content Area */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-grow: 1;
    }

    .devanagari-title {
      font-size: clamp(2.4rem, 10vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .devotional-toolbar {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }

    .dev-btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 10, 5, 0.7);
      border-radius: 30px;
      touch-action: manipulation;
      border: 1px solid var(--liquid-border);
      cursor: pointer;
    }

    /* Mobile Floating Audio Player */
    .player-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 0 10px 8px 10px;
    }

    .player-card {
      width: 100%;
      background: var(--player-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--liquid-border);
      border-radius: 20px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .album-art {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.3);
      animation: rotateArt 18s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }

    .album-art.playing { animation-play-state: running; }

    @keyframes rotateArt { 100% { transform: rotate(360deg); } }

    .song-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .song-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      color: #1a0a00;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    #progressBar {
      flex: 1;
      height: 4px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .time-stamps {
      font-size: 9px;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
    }

    /* Mobile Sheet Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: rgba(20, 8, 5, 0.95);
      border: 1px solid var(--liquid-border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-gold);
      font-size: 16px;
      display: none;
      cursor: pointer;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-body-container {
      overflow-y: auto;
      margin-top: 10px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .theme-card {
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      height: 90px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 6px;
      cursor: pointer;
    }

    .theme-card.active { border-color: var(--accent-gold); }

    .theme-card span {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 4px;
      border-radius: 4px;
      width: 100%;
      text-align: center;
    }

    .playlist-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .playlist-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 209, 102, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
    }

    .playlist-info h4 { font-size: 14px; }
    .playlist-info p { font-size: 11px; color: rgba(255, 255, 255, 0.6); }

    .song-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .song-item.active {
      background: rgba(255, 209, 102, 0.18);
      border: 1px solid rgba(255, 209, 102, 0.3);
    }

    .song-item-title { font-size: 12px; font-weight: 600; display: block; }
    .song-item-artist { font-size: 10px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body class="theme-art">

  <div class="app-container">
    <canvas id="visualizerCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>

    <div class="background-container">
      <div class="overlay"></div>
    </div>

    <!-- Mobile Header -->
    <header class="top-bar">
      <div class="header-top">
        <div class="time-display" id="timeDisplay">--:-- --</div>
        <div class="online-indicator liquid-pill">
          <span class="green-dot"></span>
          <span class="online-count" id="onlineCount">1 online</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="pill-btn liquid-pill" id="themeBtn"><i class="fa-solid fa-palette"></i> Themes</button>
        <a href="https://open.spotify.com" target="_blank" rel="noopener" class="icon-btn" id="spotifyBtn"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://music.youtube.com" target="_blank" rel="noopener" class="icon-btn red" id="ytBtn"><i class="fa-brands fa-youtube"></i></a>
        <button class="pill-btn liquid-pill" id="playlistsBtn">Playlists</button>
        <button class="pill-btn liquid-pill" id="songsBtn">All Tracks</button>
      </div>
    </header>

    <!-- Center Hero Section -->
    <main class="center-content">
      <div class="title-group">
        <h1 class="devanagari-title">गणपति उत्सव</h1>
        <p class="subtitle">GANPATI RADIO • OPEN ALL HOURS</p>
      </div>

      <div class="devotional-toolbar">
        <button class="dev-btn liquid-pill" id="flowerBtn"><i class="fa-solid fa-spa"></i> Pushpa Varsha</button>
      </div>
    </main>

    <!-- Bottom Audio Controls -->
    <footer class="player-wrapper">
      <div class="player-card">
        <div class="song-info">
          <img id="albumArt" src="https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=400&auto=format&fit=crop" alt="Album Art" class="album-art">
          <div class="song-details">
            <h3 id="songTitle" class="song-title">Loading...</h3>
            <p id="artistName" class="artist-name">Ganpati Radio</p>
          </div>
        </div>

        <div class="player-controls-row">
          <div class="playback-buttons">
            <button id="prevBtn" class="control-btn" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playPauseBtn" class="play-btn" aria-label="Play/Pause"><i id="playIcon" class="fa-solid fa-play"></i></button>
            <button id="nextBtn" class="control-btn" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <div class="progress-container">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="time-stamps">
              <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Mobile Drawer Modal -->
  <div class="modal" id="songsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
          <h2 class="modal-title" id="modalTitle">Playlists</h2>
        </div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body-container" id="modalBodyContainer"></div>
    </div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous" playsinline></audio>

  <script>
    // --- Data Definitions ---
    const themes = [
      { id: "theme-art", name: "Watercolor Art", img: "https://images.unsplash.com/photo-1631541909061-71e349d1f203?q=80&w=600&auto=format&fit=crop" },
      { id: "theme-gold", name: "Traditional Gold", img: "https://images.unsplash.com/photo-1567157577867-05ccb1388e66?q=80&w=600&auto=format&fit=crop" },
      { id: "theme-neon", name: "Neon Festive", img: "https://images.unsplash.com/photo-1609102026400-0e922f30b991?q=80&w=600&auto=format&fit=crop" },
      { id: "theme-dark", name: "Divine Cyan", img: "https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=600&auto=format&fit=crop" }
    ];

    const baseAudioCDN = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-";
    
    const songPlaylist = [
      { id: 1, title: "1. Deva Shree Ganesha", artist: "Ajay Gogavale", src: `${baseAudioCDN}1.mp3` },
      { id: 2, title: "2. Maurya Re", artist: "Shankar Mahadevan", src: `${baseAudioCDN}2.mp3` },
      { id: 3, title: "3. Sadda Dil Vi Tu", artist: "Hard Kaur", src: `${baseAudioCDN}3.mp3` },
      { id: 4, title: "4. Aala Re Aala Ganesha", artist: "Wajid", src: `${baseAudioCDN}4.mp3` },
      { id: 5, title: "5. Bappa", artist: "Vishal Dadlani", src: `${baseAudioCDN}5.mp3` }
    ];

    const aartiList = [
      { id: 101, title: "1. Sukhkarta Dukhharta Aarti", artist: "Sadhana Sargam", src: `${baseAudioCDN}1.mp3` },
      { id: 102, title: "2. Shendur Lal Chadhayo Aarti", artist: "Ravindra Sathe", src: `${baseAudioCDN}2.mp3` }
    ];

    const fullPlaylist = [...songPlaylist, ...aartiList];
    let currentTrackIndex = 0;

    // --- DOM Elements ---
    const audio = document.getElementById("audioPlayer");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const songTitle = document.getElementById("songTitle");
    const artistName = document.getElementById("artistName");
    const albumArt = document.getElementById("albumArt");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");

    const songsModal = document.getElementById("songsModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const backBtn = document.getElementById("backBtn");
    const modalTitle = document.getElementById("modalTitle");
    const songsBtn = document.getElementById("songsBtn");
    const playlistsBtn = document.getElementById("playlistsBtn");
    const themeBtn = document.getElementById("themeBtn");
    const flowerBtn = document.getElementById("flowerBtn");
    const modalBodyContainer = document.getElementById("modalBodyContainer");

    // --- Audio Player Logic ---
    function loadTrack(index) {
      const track = fullPlaylist[index];
      songTitle.textContent = track.title;
      artistName.textContent = track.artist;
      audio.src = track.src;
    }

    function togglePlay() {
      if (audio.paused) {
        // Initialize Web Audio API on user interaction if needed
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        audio.play().then(() => {
          playIcon.className = "fa-solid fa-pause";
          albumArt.classList.add("playing");
        }).catch((e) => {
          playIcon.className = "fa-solid fa-play";
          albumArt.classList.remove("playing");
        });
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        albumArt.classList.remove("playing");
      }
    }

    nextBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    prevBtn.addEventListener("click", () => {
      currentTrackIndex = (currentTrackIndex - 1 + fullPlaylist.length) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    playPauseBtn.addEventListener("click", togglePlay);

    // Auto play next track when ended
    audio.addEventListener("ended", () => {
      currentTrackIndex = (currentTrackIndex + 1) % fullPlaylist.length;
      loadTrack(currentTrackIndex);
      togglePlay();
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    // --- Modal Interactions ---
    themeBtn.addEventListener("click", () => { openModal(); renderThemeView(); });
    playlistsBtn.addEventListener("click", () => { openModal(); renderPlaylistsView(); });
    songsBtn.addEventListener("click", () => { openModal(); renderAllTracksView(); });
    closeModalBtn.addEventListener("click", closeModal);
    backBtn.addEventListener("click", renderPlaylistsView);

    function openModal() { songsModal.style.display = "flex"; }
    function closeModal() { songsModal.style.display = "none"; }

    function renderThemeView() {
      modalTitle.textContent = "Select Wallpaper Theme";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = `<div class="theme-grid"></div>`;
      const grid = modalBodyContainer.querySelector(".theme-grid");

      themes.forEach(t => {
        const card = document.createElement("div");
        card.className = `theme-card ${document.body.classList.contains(t.id) ? 'active' : ''}`;
        card.style.backgroundImage = `url('${t.img}')`;
        card.innerHTML = `<span>${t.name}</span>`;
        card.addEventListener("click", () => {
          document.body.className = t.id;
          closeModal();
        });
        grid.appendChild(card);
      });
    }

    function renderPlaylistsView() {
      modalTitle.textContent = "Playlists";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = `
        <div class="playlist-card" id="playlistSongs">
          <div class="playlist-icon"><i class="fa-solid fa-music"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Songs</h4>
            <p>${songPlaylist.length} Songs • Devotional Collection</p>
          </div>
        </div>
        <div class="playlist-card" id="playlistAartis">
          <div class="playlist-icon"><i class="fa-solid fa-om"></i></div>
          <div class="playlist-info">
            <h4>Ganpati Aartis</h4>
            <p>${aartiList.length} Aartis • Sacred Chants</p>
          </div>
        </div>
      `;

      document.getElementById("playlistSongs").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Songs", songPlaylist, 0);
      });
      document.getElementById("playlistAartis").addEventListener("click", () => {
        renderPlaylistTracks("Ganpati Aartis", aartiList, songPlaylist.length);
      });
    }

    function renderPlaylistTracks(title, trackList, globalOffset) {
      modalTitle.textContent = title;
      backBtn.style.display = "inline-block";
      modalBodyContainer.innerHTML = "";
      trackList.forEach((song, idx) => {
        modalBodyContainer.appendChild(createSongRow(song, globalOffset + idx));
      });
    }

    function renderAllTracksView() {
      modalTitle.textContent = "All Tracks";
      backBtn.style.display = "none";
      modalBodyContainer.innerHTML = "";
      fullPlaylist.forEach((song, globalIdx) => {
        modalBodyContainer.appendChild(createSongRow(song, globalIdx));
      });
    }

    function createSongRow(song, globalIndex) {
      const item = document.createElement("div");
      item.className = `song-item ${globalIndex === currentTrackIndex ? 'active' : ''}`;
      item.innerHTML = `
        <div>
          <span class="song-item-title">${song.title}</span>
          <span class="song-item-artist">${song.artist}</span>
        </div>
      `;
      item.addEventListener("click", () => {
        currentTrackIndex = globalIndex;
        loadTrack(currentTrackIndex);
        togglePlay();
        closeModal();
      });
      return item;
    }

    // --- Real-time Clock ---
    function updateTime() {
      const timeDisplay = document.getElementById("timeDisplay");
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateTime, 1000);
    updateTime();

    // --- Particle Animation System (Flower Shower) ---
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];

    function resizeCanvases() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
      vCanvas.width = window.innerWidth;
      vCanvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * pCanvas.width;
        this.y = -20;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 2 + 1;
        this.speedX = Math.random() * 2 - 1;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.color = ['#ff4d6d', '#ffd166', '#ff9f1c', '#ffffff'][Math.floor(Math.random() * 4)];
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotSpeed;
        if (this.y > pCanvas.height + 20) {
          this.reset();
        }
      }
      draw() {
        pCtx.save();
        pCtx.translate(this.x, this.y);
        pCtx.rotate((this.rotation * Math.PI) / 180);
        pCtx.fillStyle = this.color;
        pCtx.beginPath();
        // Draw simple petal shape
        pCtx.ellipse(0, 0, this.size / 2, this.size, 0, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
    }

    function triggerFlowerShower() {
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle());
      }
    }

    flowerBtn.addEventListener("click", triggerFlowerShower);

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles.forEach((p, index) => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    // --- Audio Visualizer ---
    const vCanvas = document.getElementById('visualizerCanvas');
    const vCtx = vCanvas.getContext('2d');
    let audioCtx, analyser, srcNode;

    function initAudioVisualizer() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      srcNode = audioCtx.createMediaElementSource(audio);
      srcNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 64;
    }

    audio.addEventListener('play', () => {
      initAudioVisualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (vCanvas.width / bufferLength) * 2.5;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * (vCanvas.height / 3);
        vCtx.fillStyle = `rgba(255, 209, 102, ${dataArray[i] / 255 + 0.2})`;
        vCtx.fillRect(x, vCanvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();
    animateParticles();
    drawVisualizer();

    // --- Optional Firebase Setup Placeholder ---
    // If Firebase config details are provided, live presence counting can be attached here.
    // Default online count remains 1.

    loadTrack(currentTrackIndex);
  </script>
</body>
